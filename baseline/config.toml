# =============================================================================
# baseline/config.toml — SINGLE SOURCE OF TRUTH for all settings.
# Read by code/engine/train.py (load_cfg). Keys are FLAT to match the exact
# names engine cfg.get(...) and model._get(cfg, ...) already use, so no model
# code change is required. Reproducibility: set `seed` -> bit-identical reruns.
# =============================================================================

# --- reproducibility ---
seed = 20260830
deterministic = true
notes = "Canonical consolidated baseline. Micro-tuned from a 48ep unseeded probe (best 21.94@E13): val plateaued 22-25 E14-25 while train loss kept falling (overfit) -> set epochs=32 (min required), wd 0.05->0.08, loss_count_weight 0.3->0.4. env: /data/miniconda/envs/cac, torch 2.10.0 cu128, py 3.12"

# --- model / backbone ---
hf_model = "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
backbone_dims = [192, 384]
input_size = 384
embed_dim = 256
exemplar_layers = 2
roi_size = 7
d_fine = 128
cond_dim = 64
gauss_sigma = 1.5
use_gca = true
use_ddca = false
use_xscale = true
xscale_size = 3

# --- data ---
data_root = "/data/dataset/FSC147"
augment = true          # random horizontal flip (seeded)
num_workers = 4

# --- TRAINING STRATEGY ---

# optimizer: adamw (torch.optim.AdamW)
optimizer = "adamw"
lr = 1.0e-3
weight_decay = 0.08     # +0.03 vs N0054 (anti-overfit: val plateaued E14-25)
betas = [0.9, 0.999]

# lr schedule: cosine (CosineAnnealingLR over epochs, no warmup)
scheduler = "cosine"
eta_min = 1.0e-6

# loss: mse on density + loss_count_weight * L1(sum(density), gt_count)
loss_function = "mse"
huber_delta = 5.0       # only used if loss_function="huber" (unused here)
loss_count_weight = 0.4 # +0.1 vs N0054 (anchor count signal)

# optimization dynamics
grad_clip = 1.0         # torch.nn.utils.clip_grad_norm_ max norm
amp = true              # fp16 autocast + GradScaler
batch_size = 16
epochs = 32             # min 32 required (per requirement); below this is invalid

# intentionally OFF (never empirically proven effective): multires 392+518,
# SWA (swa_start/swa_end), tail_reweight, dual_res_eval, paradigm!=reg
multires = false

# budget / gate
max_params_M = 32
smoke = false
