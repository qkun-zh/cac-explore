[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cac"
version = "0.1.0"
description = "Hypothesis-driven architecture evolution for FSC147 counting (HypoExplore local implementation)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision",
    "transformers",
    "huggingface_hub",
    "numpy",
    "pillow",
    "lightning>=2.4",
    "torchmetrics>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]