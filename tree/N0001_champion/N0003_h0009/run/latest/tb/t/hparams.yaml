cfg:
  amp: true
  augment: true
  backbone_dims:
  - 192
  - 384
  batch_size: 16
  betas:
  - 0.9
  - 0.999
  cond_dim: 64
  d_fine: 128
  data_root: /data/dataset/FSC147
  deterministic: true
  embed_dim: 256
  epochs: 32
  eta_min: 1.0e-06
  exemplar_layers: 2
  gauss_sigma: 1.5
  grad_clip: 1.0
  hf_model: facebook/dinov3-convnext-tiny-pretrain-lvd1689m
  huber_delta: 5.0
  input_size: 384
  loss_count_weight: 0.4
  loss_function: mse
  lr: 0.001
  max_params_M: 32
  multires: false
  notes: 'Canonical consolidated baseline. Micro-tuned from a 48ep unseeded probe
    (best 21.94@E13): val plateaued 22-25 E14-25 while train loss kept falling (overfit)
    -> set epochs=32 (min required), wd 0.05->0.08, loss_count_weight 0.3->0.4. env:
    /data/miniconda/envs/cac, torch 2.10.0 cu128, py 3.12'
  num_workers: 4
  optimizer: adamw
  roi_size: 7
  scheduler: cosine
  seed: 20260830
  smoke: false
  use_channel_gate: true
  use_ddca: false
  use_gca: true
  use_xscale: true
  weight_decay: 0.08
  xscale_size: 3
