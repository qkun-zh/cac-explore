# =============================================================================
# configs/baseline.toml — canonical reference config for N0001_champion.
# The authoritative editable copy lives at tree/N0001_champion/config.toml;
# children of N0001 derive their own config from that file (never from here).
# This copy exists only as a read-only reference for diffing.
# =============================================================================

seed = 20260830
deterministic = true
notes = "Canonical bootstrap champion. See tree/N0001_champion/README.md."

hf_model = "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
backbone_dims = [192, 384]
input_size = 384
embed_dim = 256
exemplar_layers = 2
roi_size = 7
d_fine = 128
cond_dim = 64
use_gca = true
use_ddca = false
use_xscale = true
xscale_size = 3

data_root = "/data/dataset/FSC147"
augment = true
num_workers = 4

optimizer = "adamw"
lr = 1.0e-3
weight_decay = 0.08
betas = [0.9, 0.999]
scheduler = "cosine"
eta_min = 1.0e-6
loss_function = "mse"
loss_count_weight = 0.4
grad_clip = 1.0
amp = true
batch_size = 16
epochs = 32
multires = false
max_params_M = 32