# =============================================================================
# configs/protocol_augment.toml — CANONICAL v2 data/training protocol (read-only).
#
# This file is NOT runnable. It documents protocol version 2 ("augmented
# baseline") established per user directive 2026-09-21. Model/optimizer keys are
# inherited verbatim from tree/N0001_champion/config.toml; the deltas below are
# THE canonical protocol changes:
#
#   1. augment = true   (train-time: random scale in [0.6,1.25] w/ center
#      placement back to 384 + random hflip, per-worker seeded => reproducible
#      at the fixed seed 20260830). Implemented in src/cac/data/fsc147.py
#      (_augment_scale_flip).
#   2. Test-split evaluation added: scripts/eval_test.py writes
#      <node>/test_result.json + test_perimage.json.
#
# Comparisons under v2: same-seed paired contrasts ONLY; the previous
# augment=false numbers are historical record. The first v2 baseline is the
# augmented re-run of N0002_h0001 via:
#     python scripts/repro_run.py N0002_h0001 --out /data/repro/baseline_aug_v2 --set augment=true
# then eval_test.py on its best.pth for val+test.
# =============================================================================

# --- protocol (v2 canonical; seed fixed 20260830 forever) ---
seed = 20260830
deterministic = true
augment = true
epochs = 32
input_size = 384
batch_size = 16
num_workers = 4

# --- model + optim: unchanged from champion (see tree/N0001_champion/config.toml) ---
hf_model = "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
embed_dim = 256
exemplar_layers = 2
roi_size = 7
d_fine = 128
cond_dim = 64
loss_count_weight = 0.4
lr = 1.0e-3
weight_decay = 0.08